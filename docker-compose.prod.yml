# ============================================================
# YUHLEZ - PRODUCTION / VPS DEPLOYMENT
# ============================================================
# Untuk deploy ke VPS (Ubuntu/Debian). Sudah termasuk:
#   - PHP-FPM (app)
#   - Nginx (reverse proxy + static files)
#   - MariaDB (database)
#   - Redis (cache + queue)
#   - Queue Worker (email, background jobs)
#   - Scheduler (cron tasks)
#
# CARA PAKAI DI VPS:
#   1. Install Docker & Docker Compose di VPS
#   2. Clone/copy project ke /var/www/yuhlez
#   3. cp deploy/.env.production .env
#   4. Isi .env dengan credentials VPS (APP_KEY, DB, Google OAuth, SMTP)
#   5. docker compose -f docker-compose.prod.yml up -d --build
#   6. docker compose -f docker-compose.prod.yml exec app php artisan key:generate
#   7. docker compose -f docker-compose.prod.yml exec app php artisan migrate --force
#   8. docker compose -f docker-compose.prod.yml exec app php artisan db:seed --force
#   9. docker compose -f docker-compose.prod.yml exec app php artisan storage:link
#  10. Setup SSL: certbot --nginx -d domain.com
#
# CATATAN VPS:
#   - Pastikan port 80 & 443 terbuka di firewall VPS
#   - Domain A record harus指向 ke IP VPS
#   - GOOGLE_REDIRECT_URI harus https://domain.com/v1/auth/google/callback
#   - Gunakan Mailgun/SMTP untuk email production (bukan log driver)
#   - Backup database secara berkala: mysqldump -u root yuhlez > backup.sql
# ============================================================

version: '3.8'

services:
  # ── PHP Application (Laravel) ───────────────────────────
  # Container utama yang menjalankan artisan, queue, scheduler
  # File project di-mount agar perubahan langsung terlihat
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Build args untuk optimasi:
      args:
        - APP_ENV=production
        - APP_DEBUG=false
    container_name: yuhlez-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - storage_prod:/var/www/storage/app/public
    networks:
      - yuhlez-prod
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # === VPS: Ganti semua nilai ini di .env ===
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${APP_URL:-https://yourdomain.com}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-yuhlez}
      - DB_USERNAME=${DB_USERNAME:-yuhlez}
      - DB_PASSWORD=${DB_PASSWORD:-ganti_password_vps}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=redis
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis

  # ── Nginx Web Server ────────────────────────────────────
  # Melayani file static (CSS/JS/images) dan proxy ke PHP-FPM
  # SSL di-handle oleh Nginx (Let's Encrypt)
  nginx:
    image: nginx:alpine
    container_name: yuhlez-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf
      - ssl_data:/etc/nginx/ssl
    networks:
      - yuhlez-prod
    depends_on:
      - app

  # ── MySQL Database ──────────────────────────────────────
  # MariaDB untuk penyimpanan data utama
  # AUTO_BACKUP: set cron di host untuk dump database
  mysql:
    image: mariadb:10.11
    container_name: yuhlez-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_ganti}
      MYSQL_DATABASE: ${DB_DATABASE:-yuhlez}
      MYSQL_USER: ${DB_USERNAME:-yuhlez}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ganti_password_vps}
    volumes:
      - mysql_prod:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - yuhlez-prod
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redis (Cache + Queue + Session) ─────────────────────
  # Lebih cepat dari file-based, mendukung queue dan session
  redis:
    image: redis:7-alpine
    container_name: yuhlez-redis
    restart: unless-stopped
    volumes:
      - redis_prod:/data
    networks:
      - yuhlez-prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Queue Worker ────────────────────────────────────────
  # Memproses email notifikasi dan background jobs
  # AUTO_RESTART: jika worker crash, restart otomatis
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yuhlez-queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www
      - storage_prod:/var/www/storage/app/public
    networks:
      - yuhlez-prod
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-yuhlez}
      - DB_USERNAME=${DB_USERNAME:-yuhlez}
      - DB_PASSWORD=${DB_PASSWORD:-ganti_password_vps}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis

  # ── Scheduler ───────────────────────────────────────────
  # Menjalankan artisan schedule:run setiap menit
  # Untuk cache cleanup, expired token, dll
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yuhlez-scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    volumes:
      - .:/var/www
      - storage_prod:/var/www/storage/app/public
    networks:
      - yuhlez-prod
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-yuhlez}
      - DB_USERNAME=${DB_USERNAME:-yuhlez}
      - DB_PASSWORD=${DB_PASSWORD:-ganti_password_vps}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis

# ── Networks ──────────────────────────────────────────────
networks:
  yuhlez-prod:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────
# Data persisten untuk database, cache, dan storage
volumes:
  mysql_prod:
    driver: local
  redis_prod:
    driver: local
  storage_prod:
    driver: local
  ssl_data:
    driver: local
