# ============================================================
# YUHLEZ - NGINX PRODUCTION (VPS)
# ============================================================
# Copy ke VPS: /etc/nginx/sites-available/yuhlez
# Aktifkan: ln -s /etc/nginx/sites-available/yuhlez /etc/nginx/sites-enabled/
# Test: nginx -t && systemctl reload nginx
#
# SSL SETUP:
#   certbot --nginx -d yourdomain.com -d www.yourdomain.com
#   Auto-renewal sudah di-handle oleh certbot
# ============================================================

# ── HTTP → HTTPS Redirect ─────────────────────────────────
# Semua request HTTP dialihkan ke HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Let's Encrypt verification (harus bisa diakses tanpa HTTPS)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Server ──────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # SSL (Let's Encrypt) - auto-generated oleh certbot
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Root directory - public folder Laravel
    root /var/www/yuhlez/public;
    index index.php;

    # Max upload size (50MB untuk chunked upload CV, gallery, certificate)
    client_max_body_size 50M;

    # ── Security Headers ──────────────────────────────────
    # Melindungi dari clickjacking, MIME sniffing, XSS
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Gzip Compression ──────────────────────────────────
    # Mengurangi ukuran transfer untuk CSS, JS, JSON
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ── Laravel Routing ───────────────────────────────────
    # Semua request ke index.php kecuali file yang ada
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ───────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # ── Block Hidden Files ────────────────────────────────
    # Mencegah akses ke .env, .git, .htaccess
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # ── Block Sensitive Files ─────────────────────────────
    location ~* \.(env|git|htaccess)$ {
        deny all;
    }

    # ── Static Assets Caching ─────────────────────────────
    # Cache 30 hari untuk file statis (CSS/JS/images)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Error Pages ───────────────────────────────────────
    error_page 404 /index.php;
}
