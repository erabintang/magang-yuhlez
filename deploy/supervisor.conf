# ==========================================
# YUHLEZ LARAVEL - SUPERVISOR CONFIG
# ==========================================
# Copy to: /etc/supervisor/conf.d/yuhlez.conf
# Then: supervisorctl reread && supervisorctl update

# Queue Worker (untuk email massal & background jobs)
[program:yuhlez-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/yuhlez/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/yuhlez/storage/logs/queue.log
stopwaitsecs=3600

# Scheduler (cron alternative - lebih reliable di VPS)
[program:yuhlez-scheduler]
process_name=%(program_name)s
command=/bin/bash -c "while true; do php /var/www/yuhlez/artisan schedule:run --verbose --no-interaction & sleep 60; done"
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/yuhlez/storage/logs/scheduler.log
