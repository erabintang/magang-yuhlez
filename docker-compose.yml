# ============================================================
# YUHLEZ - LOCAL DEVELOPMENT (docker compose up -d)
# ============================================================
# Untuk development di localhost, tanpa SSL, tanpa Nginx.
# PHP artisan serve sudah jalan di host, Docker hanya untuk MySQL.
#
# CARA PAKAI:
#   1. docker compose up -d mysql
#   2. cp .env.example .env
#   3. php artisan key:generate
#   4. php artisan migrate --seed
#   5. php artisan serve
#
# Untuk full stack di Docker (termasuk app + nginx):
#   docker compose --profile full up -d
# ============================================================

version: '3.8'

services:
  # ── MySQL Database ──────────────────────────────────────
  mysql:
    image: mariadb:10.11
    container_name: yuhlez-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: yuhlez
      MYSQL_USER: yuhlez
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_dev_data:/var/lib/mysql
    networks:
      - yuhlez-dev
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Laravel App (PHP-FPM) ── only with --profile full ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yuhlez-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - yuhlez-dev
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=yuhlez
      - DB_USERNAME=yuhlez
      - DB_PASSWORD=secret
    profiles:
      - full

  # ── Nginx ── only with --profile full ──
  nginx:
    image: nginx:alpine
    container_name: yuhlez-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx-dev.conf:/etc/nginx/conf.d/default.conf
    networks:
      - yuhlez-dev
    depends_on:
      - app
    profiles:
      - full

  # ── Queue Worker ── only with --profile full ──
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yuhlez-queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www
    networks:
      - yuhlez-dev
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=yuhlez
      - DB_USERNAME=yuhlez
      - DB_PASSWORD=secret
      - QUEUE_CONNECTION=database
    profiles:
      - full

networks:
  yuhlez-dev:
    driver: bridge

volumes:
  mysql_dev_data:
    driver: local
